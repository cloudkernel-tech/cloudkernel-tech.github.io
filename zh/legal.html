<style>
/* CSS to ensure preservation of capitalization */
.preserve-capitalization {
    text-transform: none !important; /* Use !important to override other styles */
}

/* ===== Language toggle switch ===== */
.lang-switch-li {
    display: flex;
    align-items: center;
}
.lang-switch-navitem {
    display: flex;
    align-items: center;
    margin-left: 10px;
}
.lang-toggle {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 4px 6px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(16,104,176,.32), rgba(16,104,176,.08));
    border: 1px solid rgba(16,104,176,.55);
    box-shadow: 0 2px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    user-select: none;
}
.lang-opt {
    font-size: .85rem;
    font-weight: 700;
    letter-spacing: .04em;
    color: rgba(255,255,255,.6);
    text-transform: none;
    text-decoration: none !important;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 999px;
    transition: color .3s ease, background .3s ease, box-shadow .3s ease;
}
.lang-opt:hover {
    color: #fff;
    background: rgba(16,104,176,.25);
}
.lang-opt--active {
    color: #fff;
    background: #1068B0;
    box-shadow: 0 0 8px rgba(16,104,176,.7);
}
.lang-toggle-divider {
    width: 1px;
    height: 14px;
    background: rgba(255,255,255,.22);
    margin: 0 2px;
}
@media (max-width: 991.98px) {
    .lang-switch-navitem {
        margin-left: 0;
        margin-top: 4px;
    }
}

/* ===== Shop dropdown menu ===== */
#mainNav .nav-item.dropdown .dropdown-menu {

    border-radius: 14px;
    padding: 10px;
    min-width: 215px;
    margin-top: 14px;
    background: #ffffff;
    box-shadow: 0 16px 40px rgba(16,104,176,.18), 0 6px 16px rgba(0,0,0,.08);
}
#mainNav .nav-item.dropdown .dropdown-menu.show {
    animation: dropdown-fade-in .22s ease;
}
#mainNav .nav-item.dropdown .dropdown-item {
    border-radius: 10px;
    padding: 10px 14px;
    font-size: .95rem;
    font-weight: 600;
    color: #37454f;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background .2s ease, color .2s ease, transform .2s ease;
}
#mainNav .nav-item.dropdown .dropdown-item i {
    width: 22px;
    text-align: center;
    color: #1068B0;
    font-size: 1.15rem;
    transition: transform .2s ease;
}
#mainNav .nav-item.dropdown .dropdown-item:hover,
#mainNav .nav-item.dropdown .dropdown-item:focus {
    background: #eaf3fb;
    color: #1068B0;
    transform: translateX(3px);
}
#mainNav .nav-item.dropdown .dropdown-item:hover i,
#mainNav .nav-item.dropdown .dropdown-item:focus i {
    transform: scale(1.12);
}
@keyframes dropdown-fade-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
